<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bunny Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<style>
:root{
  --sky1:#8fd3ff; --sky2:#e9f8ff; --hud:rgba(255,255,255,.82); --hud-fg:#23403a;
  --card:#fffaf0; --card-fg:#2b3a35; --muted:#5d7a70; --accent:#ff6f91; --accent-fg:#fff;
  --dim:rgba(20,40,50,.55); --ground:#4caf50; --soil:#8d6e4a; --plate:#a1744a; --plate-top:#6fcf6f;
  --cloud:rgba(255,255,255,.85);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#101b3d; --sky2:#2d3f73; --hud:rgba(20,28,50,.8); --hud-fg:#e8f0ff;
    --card:#1c2745; --card-fg:#eef3ff; --muted:#a6b6dd; --dim:rgba(0,0,10,.6);
    --ground:#2e7d4f; --soil:#5a4632; --plate:#7a5a3c; --plate-top:#4aa86a; --cloud:rgba(255,255,255,.18);
  }
}
:root[data-theme="dark"]{
  --sky1:#101b3d; --sky2:#2d3f73; --hud:rgba(20,28,50,.8); --hud-fg:#e8f0ff;
  --card:#1c2745; --card-fg:#eef3ff; --muted:#a6b6dd; --dim:rgba(0,0,10,.6);
  --ground:#2e7d4f; --soil:#5a4632; --plate:#7a5a3c; --plate-top:#4aa86a; --cloud:rgba(255,255,255,.18);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:linear-gradient(var(--sky1),var(--sky2));font-family:'Fredoka',system-ui,sans-serif;color:var(--hud-fg)}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;pointer-events:none}
.pill{background:var(--hud);color:var(--hud-fg);padding:6px 14px;border-radius:999px;font-weight:600;font-size:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);backdrop-filter:blur(6px)}
.pill small{font-weight:400;opacity:.7;margin-right:4px}
#overlay{position:fixed;inset:0;background:var(--dim);display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(3px)}
#overlay.hidden{display:none}
.card{background:var(--card);color:var(--card-fg);border-radius:28px;padding:30px 34px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card .emoji{font-size:64px;line-height:1}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.card{animation:pop .35s ease-out}
@media (prefers-reduced-motion: reduce){.card{animation:none}}
.card h1{margin:10px 0 6px;font-size:34px}
.card p{margin:6px 0;color:var(--muted);font-size:17px;line-height:1.4}
.keys{margin:14px 0 20px;font-size:15px;color:var(--muted)}
kbd{background:rgba(127,127,127,.2);border-radius:6px;padding:2px 8px;font-family:inherit;font-weight:600}
button.main{margin-top:6px;padding:14px 32px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-fg);
  font:600 20px 'Fredoka',system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
button.main:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
button.main:focus-visible,.tc:focus-visible{outline:3px solid var(--hud-fg);outline-offset:3px}
#touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;
  padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
@media (pointer:coarse){#touch{display:flex}}
.tc{width:68px;height:68px;border-radius:50%;border:0;background:var(--hud);color:var(--hud-fg);font-size:28px;
  box-shadow:0 3px 10px rgba(0,0,0,.25)}
.tc:active{transform:scale(.92)}
.grp{display:flex;gap:14px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="pill"><small>Score</small><span id="score">0</span></div>
  <div class="pill"><small>🥕</small><span id="carrots">0/5</span></div>
  <div class="pill"><small>Time</small><span id="time">0.0s</span></div>
  <div class="pill"><small>Best</small><span id="highScore">0</span></div>
</div>
<div id="touch">
  <div class="grp"><button class="tc" id="bL" aria-label="Move left">◀</button><button class="tc" id="bR" aria-label="Move right">▶</button></div>
  <button class="tc" id="bU" aria-label="Jump">⬆</button>
</div>
<div id="overlay">
  <div class="card">
    <div class="emoji" id="oEmoji">🐰</div>
    <h1 id="oTitle">Bunny Home</h1>
    <p id="oText">Hop across the moving platforms, grab the carrots and reach the cottage. Dodge the aliens!</p>
    <div class="keys"><kbd>←</kbd> <kbd>→</kbd> move &nbsp; <kbd>↑</kbd> / <kbd>Space</kbd> jump</div>
    <button class="main" id="startBtn">▶️ Start Game</button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const canvas = $("game"), ctx = canvas.getContext("2d");
const GRAVITY = 0.6, STEP = 1000 / 60, CARROT_COUNT = 5;
let W, H, groundY, bunny, plates, enemies, carrots, home, clouds = [];
let state = "ready";
let score = 0, frames = 0, countdown = 0, got = 0;
let highScore = 0;
try { highScore = parseInt(localStorage.getItem("bunnyHigh"), 10) || 0; } catch (e) {}
$("highScore").textContent = highScore;
const keys = { left:false, right:false, up:false };
function setKey(k, v){ keys[k] = v; }
addEventListener("keydown", e => {
  const m = { ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", " ":"up", a:"left", d:"right", w:"up" }[e.key];
  if (m){ setKey(m, true); e.preventDefault(); }
});
addEventListener("keyup", e => {
  const m = { ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", " ":"up", a:"left", d:"right", w:"up" }[e.key];
  if (m) setKey(m, false);
});
[["bL","left"],["bR","right"],["bU","up"]].forEach(([id,k]) => {
  const b = $(id);
  b.addEventListener("pointerdown", e => { e.preventDefault(); setKey(k, true); });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => b.addEventListener(ev, () => setKey(k, false)));
});
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  groundY = H * 0.85;
  if (state === "ready" || state === "over") init();
}
function init(){
  bunny = { x:60, y:groundY - 40, w:40, h:40, dy:0, jumping:false, onPlate:null, face:1 };
  const span = Math.max(W - 140, 200);
  const spec = [[0.06,120,1.2],[0.30,200,-1.5],[0.58,260,1],[0.90,180,-1.3]];
  plates = spec.map(([f,h,dx]) => ({ x:span * f, y:groundY - h, w:140, h:20, dx }));
  home = { x:W - 90, y:groundY - 280, size:50 };
  carrots = [0,1,2,3].map(i => ({ x:plates[i].x + 55, y:plates[i].y - 48, taken:false }));
  carrots.push({ x:W * 0.45, y:groundY - 40, taken:false });
  enemies = [];
  const n = Math.floor(Math.random() * 4) + 5;
  let tries = 0;
  while (enemies.length < n && tries++ < 400){
    const ground = Math.random() > 0.5;
    const e = {
      x: Math.random() * (W - 80),
      y: ground ? groundY - 40 : groundY - (120 + Math.random() * 200),
      w:40, h:40,
      dx:(Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1)
    };
    const far = Math.hypot(e.x - bunny.x, e.y - bunny.y) > 320 && Math.hypot(e.x - home.x, e.y - home.y) > 140;
    if (far) enemies.push(e);
  }
  clouds = Array.from({ length:5 }, (_, i) => ({ x:Math.random() * W, y:40 + i * 38 + Math.random() * 30, s:0.5 + Math.random() * 0.8 }));
  score = 0; frames = 0; got = 0;
  updateHud();
}
function updateHud(){
  $("score").textContent = score;
  $("carrots").textContent = got + "/" + CARROT_COUNT;
  $("time").textContent = (frames / 60).toFixed(1) + "s";
}
function showOverlay(emoji, title, text, btn){
  $("oEmoji").textContent = emoji; $("oTitle").textContent = title;
  $("oText").textContent = text; $("startBtn").textContent = btn;
  $("overlay").classList.remove("hidden");
  $("startBtn").focus();
}
function beginRound(){
  init();
  state = "countdown"; countdown = 180;
  $("overlay").classList.add("hidden");
  $("startBtn").blur();
}
$("startBtn").addEventListener("click", () => {
  if (state === "over") location.reload();
  else beginRound();
});
function endGame(win){
  if (state === "over") return;
  if (win) score += Math.max(0, 1000 - Math.floor(frames / 6));
  state = "over";
  let newBest = score > highScore;
  if (newBest){
    highScore = score;
    try { localStorage.setItem("bunnyHigh", highScore); } catch (e) {}
  }
  updateHud();
  $("highScore").textContent = highScore;
  const extra = newBest ? " New best score!" : "";
  if (win) showOverlay("🏡", "You made it home!", "Score " + score + " with " + got + " of " + CARROT_COUNT + " carrots in " + (frames/60).toFixed(1) + "s." + extra, "🔄 Play Again");
  else showOverlay("💥", "Caught by an alien", "You collected " + got + " carrots and scored " + score + "." + extra + " Give it another hop.", "🔄 Play Again");
}
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function step(){
  if (state === "countdown"){
    clouds.forEach(c => { c.x += c.s * 0.3; if (c.x > W + 80) c.x = -80; });
    if (--countdown <= 0) state = "playing";
    frames = 0;
    return;
  }
  frames++;
  if (keys.left){ bunny.x -= 4; bunny.face = -1; }
  if (keys.right){ bunny.x += 4; bunny.face = 1; }
  if (keys.up && !bunny.jumping){ bunny.dy = -12; bunny.jumping = true; bunny.onPlate = null; }
  bunny.dy += GRAVITY;
  bunny.y += bunny.dy;
  if (bunny.y + bunny.h >= groundY){
    bunny.y = groundY - bunny.h; bunny.dy = 0; bunny.jumping = false; bunny.onPlate = null;
  }
  plates.forEach(p => {
    p.x += p.dx;
    if (p.x < 0 || p.x + p.w > W) p.dx *= -1;
    if (bunny.x < p.x + p.w && bunny.x + bunny.w > p.x &&
        bunny.y + bunny.h <= p.y + 10 && bunny.y + bunny.h + bunny.dy >= p.y){
      bunny.dy = 0; bunny.jumping = false; bunny.y = p.y - bunny.h; bunny.onPlate = p;
    }
  });
  if (bunny.onPlate) bunny.x += bunny.onPlate.dx;
  bunny.x = Math.max(0, Math.min(W - bunny.w, bunny.x));
  clouds.forEach(c => { c.x += c.s * 0.3; if (c.x > W + 80) c.x = -80; });
  enemies.forEach(e => {
    e.x += e.dx;
    if (e.x < 0 || e.x + e.w > W) e.dx *= -1;
    if (hit(bunny, e)) endGame(false);
  });
  carrots.forEach(c => {
    if (!c.taken && hit(bunny, { x:c.x, y:c.y, w:34, h:34 })){ c.taken = true; got++; score += 100; }
  });
  if (hit(bunny, home)) endGame(true);
  updateHud();
}
function emoji(txt, x, y, size, flip){
  ctx.font = size + "px 'Segoe UI Emoji','Apple Color Emoji',sans-serif";
  if (flip){ ctx.save(); ctx.translate(x + size / 2, 0); ctx.scale(-1, 1); ctx.fillText(txt, -size / 2, y); ctx.restore(); }
  else ctx.fillText(txt, x, y);
}
function draw(){
  const css = getComputedStyle(document.documentElement);
  const v = n => css.getPropertyValue(n).trim();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = v("--cloud");
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 22 * c.s + 8, 0, 7); ctx.arc(c.x + 24, c.y + 4, 18 * c.s + 8, 0, 7); ctx.arc(c.x - 22, c.y + 6, 16 * c.s + 6, 0, 7);
    ctx.fill();
  });
  ctx.fillStyle = v("--soil"); ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = v("--ground"); ctx.fillRect(0, groundY, W, 14);
  plates.forEach(p => {
    ctx.fillStyle = v("--plate"); ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = v("--plate-top"); ctx.fillRect(p.x, p.y, p.w, 6);
  });
  carrots.forEach(c => { if (!c.taken) emoji("🥕", c.x, c.y + 30, 30); });
  emoji("🏡", home.x - 4, home.y + 44, 52);
  const frozen = state === "countdown" || state === "ready";
  ctx.globalAlpha = state === "countdown" ? 0.6 : 1;
  enemies.forEach(e => emoji("👾", e.x, e.y + 32, 32));
  ctx.globalAlpha = 1;
  const bob = state === "countdown" ? Math.sin(Date.now() / 120) * 2 : 0;
  emoji("🐰", bunny.x, bunny.y + 32 + bob, 36, bunny.face < 0);
  if (state === "countdown"){
    ctx.fillStyle = "rgba(255,255,255,.95)"; ctx.textAlign = "center";
    ctx.font = "600 80px 'Fredoka',system-ui,sans-serif";
    ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 6;
    const t = Math.ceil(countdown / 60) + "";
    ctx.strokeText(t, W / 2, H * 0.4); ctx.fillText(t, W / 2, H * 0.4);
    ctx.font = "600 22px 'Fredoka',system-ui,sans-serif";
    ctx.fillText("Aliens wake up in…", W / 2, H * 0.4 - 90);
    ctx.textAlign = "left";
  }
}
let last = 0, acc = 0;
function frame(t){
  requestAnimationFrame(frame);
  const dt = Math.min(t - last, 100); last = t;
  if (state === "countdown" || state === "playing"){
    acc += dt;
    while (acc >= STEP && (state === "countdown" || state === "playing")){ step(); acc -= STEP; }
  }
  draw();
}
resize();
addEventListener("resize", resize);
showOverlay("🐰", "Bunny Home", "Hop across the moving platforms, grab the carrots and reach the cottage. Dodge the aliens!", "▶️ Start Game");
requestAnimationFrame(frame);
</script>
</body>
</html>
